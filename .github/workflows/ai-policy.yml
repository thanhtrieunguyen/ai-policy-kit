name: AI Policy Compliance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-policy:
    name: Validate AI Contribution Policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build action distribution
        run: npm run build

      - name: Run AI Policy Action (Dogfooding)
        uses: ./
        with:
          policy-path: '.github/ai-policy.yml'
          base-ref: ${{ github.event.pull_request.base.ref || 'main' }}
          head-ref: ${{ github.event.pull_request.head.ref || 'HEAD' }}
          pr-body: ${{ github.event.pull_request.body || '' }}
          fail-on-leak: 'true'
